<script>
(function(){
  // ---------- AUDIO CONTROLLER (single source, strict root paths) ----------
  let currentAudio = null;
  let winnerLoopVideo = null; // optional muted looping video for winner state

  function stopCurrentAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
  }

  function playSound(src, onError = null) {
    stopCurrentAudio();
    const audio = new Audio(src);
    currentAudio = audio;
    audio.play().catch(e => {
      console.warn(`Audio play failed: ${src}`, e);
      if (onError) onError(e);
    });
  }

  // Preload key assets (optional but improves responsiveness)
  const preloadList = ["login.mp3", "shuffle.mp3", "started.mp3", "stopped.mp3", "continued.mp3", "nreistered.mp3", "nwinner.mp3", "winner.mp3"];
  preloadList.forEach(src => { const a = new Audio(src); a.load(); });
  // preload bingo number sounds map (1..75)
  for (let i = 1; i <= 75; i++) { 
    let letter = i<=15?'b':i<=30?'i':i<=45?'n':i<=60?'g':'o';
    let file = `${letter}${i}.mp3`;
    const a = new Audio(file); a.load();
  }

  // Background image controller
  function setPageBackground(imgSrc) {
    document.body.style.backgroundImage = `url('${imgSrc}')`;
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center";
    document.body.style.backgroundRepeat = "no-repeat";
    document.body.classList.remove("bg-animation-default");
  }
  function resetBackgroundToDefault() {
    document.body.style.backgroundImage = "";
    document.body.classList.add("bg-animation-default");
  }
  // Initially set default animation
  document.body.classList.add("bg-animation-default");

  // Video loop for winner (muted autoplay)
  function startWinnerVideoLoop() {
    if (winnerLoopVideo) {
      winnerLoopVideo.pause();
      winnerLoopVideo = null;
    }
    const video = document.createElement("video");
    video.src = "video.mp4";
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.style.position = "fixed";
    video.style.top = "0";
    video.style.left = "0";
    video.style.width = "100%";
    video.style.height = "100%";
    video.style.objectFit = "cover";
    video.style.zIndex = "-1";
    video.style.opacity = "0.4";
    video.style.pointerEvents = "none";
    document.body.appendChild(video);
    winnerLoopVideo = video;
    video.play().catch(e => console.warn("video autoplay muted failed", e));
  }
  function stopWinnerVideoLoop() {
    if (winnerLoopVideo) {
      winnerLoopVideo.pause();
      winnerLoopVideo.remove();
      winnerLoopVideo = null;
    }
  }

  // ---------- FULLSCREEN (preserved) ----------
  function toggleFullscreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
      const docEl = document.documentElement;
      const requestFullscreen = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
      if (requestFullscreen) { requestFullscreen.call(docEl).catch(e => console.warn(e)); }
    } else {
      const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (exitFullscreen) { exitFullscreen.call(document).catch(e => console.warn(e)); }
    }
  }
  document.addEventListener('DOMContentLoaded', function() {
    ['fullscreenToggle', 'headerFsPage1', 'headerFsPage2', 'headerFsPage3'].forEach(id => {
      const btn = document.getElementById(id);
      if(btn) btn.addEventListener('click', toggleFullscreen);
    });
  });

  // 15 LANGUAGES (preserved unchanged)

  document.getElementById('startGameBtn').onclick=()=>{ if(adminPermissions.boardEnabled===false && currentUser?.type!=='admin'){ showToast('Board selection disabled by admin'); return; } if(currentUser && currentUser.boardLocked){ showToast('Your board access is locked by admin'); return; } if(windowSelectedBoardValues.length){ totalRounds=+document.getElementById('gameRoundSelect').value; currentRound=1; initGame(windowSelectedBoardValues); switchPage('page2'); } else showToast('Select boards'); };
  document.getElementById('backToWelcomeBtn').onclick=()=>switchPage('page0');
  document.getElementById('backToRegIconBtn').onclick=()=>{ if(callingInterval)clearInterval(callingInterval); callingInterval=null; stopWinnerVideoLoop(); resetBackgroundToDefault(); switchPage('page1'); };
  document.getElementById('summaryIconBtn').onclick=()=>{ if(!adminPermissions.withdrawEnabled && currentUser?.type!=='admin' ){ showToast('Withdrawals disabled by admin'); return; } if(currentUser?.withdrawLocked){ showToast('Your withdrawals are locked'); return; } switchPage('page3'); };
  document.getElementById('backToGameFromSummary').onclick=()=>switchPage('page2');
  document.getElementById('langToggleBtn').onclick=(e)=>{ e.stopPropagation(); const dd=document.getElementById('langDropdown'); dd.style.display=dd.style.display==='none'?'block':'none'; };
  document.addEventListener('click',(e)=>{ if(!e.target.closest('#langToggleBtn')&&!e.target.closest('#langDropdown')) document.getElementById('langDropdown').style.display='none'; });
  window.createUserFromRegister = () => { let name = document.getElementById('userName').value.trim() || 'Guest'; let phone = document.getElementById('playerPhone').value.trim() || '09xxxx'; let role = document.getElementById('roleSelect').value; let gameAmt = parseInt(document.getElementById('gameAmountSelect').value) || 10; if(role === 'player') { currentUser = { id: Date.now()+'_'+Math.random(), name, phone, type:'player', balance:500, paidBalance:0, wonBalance:0, gameAmount:gameAmt, rewardPoints:0, totalCommission:0, totalWithdrawn:0, jackpotHit:0, boardLocked:false, withdrawLocked:false }; users.push(currentUser); handlePlayerPayment('player'); } else { currentUser = { id: Date.now()+'_agt', name, phone, type:'agent', paidBalance:0, wonBalance:0, totalCommission:0, rewardPoints:0, jackpotHit:0, totalWithdrawn:0, boardLocked:false, withdrawLocked:false }; users.push(currentUser); } saveData(); addNotification(`${name} registered as ${role}`); switchPage('page1'); };
  window.handlePlayerPayment = (role) => { if(role==='player') { let msgAmh = `💸 ለመጫወት ክፍያ ያስፈልጋል!\nCBE: 1000062264911 ወይም Telebirr: 0918203416\nከከፈሉ በኋላ ስክሪን ሾት ወደ Telegram ይላኩ: t.me/GOGSmore`; alert(msgAmh); window.open('https://t.me/GOGSmore', '_blank'); } };
  document.getElementById('withdrawCallBtn').onclick = () => { if(!adminPermissions.withdrawEnabled){ showToast('Withdrawals disabled by admin'); return; } let amt = parseFloat(document.getElementById('withdrawAmount').value); if(!currentUser) return showToast('Login required'); let total = (currentUser.paidBalance||0)+(currentUser.wonBalance||0)+(currentUser.totalCommission||0)+(currentUser.rewardPoints||0)+(currentUser.jackpotHit||0); if(isNaN(amt) || amt<25) return showToast('Min 25 ETB'); if(amt>total) return showToast('Insufficient balance'); let msg = `🏦 WITHDRAW REQUEST\n👤 ${currentUser.name}\n📞 ${currentUser.phone}\n💰 ${amt} ETB\n💎 Please reply with your withdrawal method (CBE or Telebirr) and account number. Date: ${new Date().toLocaleDateString()}`; navigator.clipboard.writeText(msg); window.open('https://t.me/GOGSmore', '_blank'); addNotification(`Withdraw ${amt} requested`); };
  if(!users.length) users.push({id:'admin1',name:'Admin',type:'admin'});
  saveData(); updateUI(); setInterval(updateUI, 1000);
})();
</script>
