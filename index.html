<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Times New Roman', Times, serif; background: #0b2b26; transition: background-image 0.2s ease; background-size: cover; background-position: center; background-repeat: no-repeat; }
    .container { width: 100vw; height: 100dvh; display: flex; flex-direction: column; border: 3px solid #ff0000; box-shadow: 0 0 0 2px #00ccff, inset 0 0 0 2px #ffaa33; animation: borderPulse 1.2s infinite; overflow: hidden; background: rgba(0, 30, 40, 0.75); backdrop-filter: blur(1.5px); }
    @keyframes borderPulse { 0%,100% { border-color: #ff0000; } 25% { border-color: #00ccff; } 50% { border-color: #ffd966; } 75% { border-color: #ffaa33; } }
    .page { display: none; flex-direction: column; width: 100%; height: 100%; padding: max(8px, 2vh) max(6px, 2vw); gap: min(12px, 2vh); overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; scrollbar-width: thin; position: relative; }
    .active-page { display: flex; }
    .action-btn, .member-btn, .admin-panel-btn, .withdraw-btn, .close-overlay { background: #0066cc !important; color: white !important; border: none !important; border-radius: 14px !important; cursor: pointer; text-align: center; padding: 14px 18px !important; font-size: 1rem !important; font-weight: 800 !important; flex: 1 1 0; min-width: 0; white-space: nowrap; touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; transition: all 0.05s linear; box-shadow: 0 4px 8px rgba(0,0,0,0.35); }
    .control-rect-btn { background: #0066cc !important; color: white !important; border: none !important; border-radius: 12px !important; cursor: pointer; text-align: center; padding: 14px 12px !important; font-size: 1.2rem !important; font-weight: 800 !important; flex: 1 1 0; min-width: 65px; touch-action: manipulation; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 3px 7px rgba(0,0,0,0.4); gap: 6px; }

    .register-buttons { gap: clamp(20px, 5vw, 36px) !important; margin-top: 6px; }

    .white-label { color: white !important; font-weight: bold; display: block; margin-bottom: 4px; text-shadow: 0 0 2px black; }
    .header-row { display: flex; justify-content: space-between; align-items: center; background: #0044aa; border-radius: 0; padding: 6px 12px; flex-shrink: 0; border-bottom: 3px solid #ffcc44; border-top: 2px solid #ffcc66; width: 98%; margin-left: 1%; margin-bottom: 6px; }
    .member-counter-btn { background: transparent !important; border: none !important; font-size: clamp(0.8rem, 3.5vw, 1.1rem); font-weight: bold; color: #ffeaac; min-width: 50px; cursor: default; }

    .boards-carousel { display: flex; overflow-x: auto; gap: clamp(10px, 3vw, 20px); width: 100%; flex: 1; scroll-snap-type: x mandatory; padding-bottom: 6px; min-height: 0; }

    .board-full-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: clamp(3px, 1.2vw, 8px); width: 100%; aspect-ratio: 1 / 0.9; }
    .board-cell { background: #fff9ef; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: clamp(8px, 4vw, 18px); font-size: clamp(0.7rem, 3vw, 1.1rem); font-weight: 800; color: black; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

    .lang-option { background: #2b4b42; color: #ffd966; padding: 10px 14px; margin: 6px 0; border-radius: 40px; cursor: pointer; text-align: center; }

    @keyframes whiteFlash { 0%,100% { opacity: 0.8; } 50% { opacity: 1; text-shadow: 0 0 25px white; } }
    @keyframes doorPulse { 0% { transform: scale(1); opacity: 0.95; } 50% { transform: scale(1.02); opacity: 1; } 100% { transform: scale(1); opacity: 0.95; } }
    .board-grid-responsive { display: grid !important; grid-template-columns: repeat(6, 1fr) !important; gap: 6px; max-height: 55vh; overflow-y: auto; padding: 8px; }
    .developer-credit { position: absolute; bottom: 20px; right: 20px; font-size: clamp(13px, 4vw, 20px); font-weight: bold; animation: greenFlash 1.5s infinite; color: #aaffaa; background: transparent; }
    @keyframes greenFlash { 0%,100% { color: #aaffaa; } 50% { color: #ffff88; } }
    .floating-text { position: fixed; z-index: 9999; font-weight: bold; font-size: 2rem; pointer-events: auto; white-space: nowrap; background: transparent; }
    .fullscreen-win-notify { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); backdrop-filter: blur(16px); z-index: 10000; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; color: gold; font-size: 2rem; }
    .admin-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    .admin-toggle-btn { background: #ffaa33; color: #1a332e; padding: 12px; border-radius: 40px; font-weight: bold; cursor: pointer; border: none; }
    .floating-editable-timer { background: transparent; border: none; outline: none; text-align: center; font-family: monospace; font-size: 2rem; font-weight: bold; width: auto; min-width: 180px; color: #ffff88; text-shadow: 0 0 8px #ffcc00; }
    .editable-floating { background: transparent; border: none; outline: none; text-align: center; font-family: inherit; font-size: inherit; color: inherit; text-shadow: inherit; width: auto; min-width: 80px; }
    .tiny-icon-btn { position: absolute; bottom: 20px; left: 20px; width: 48px; height: 48px; background: transparent; border: none; font-size: 32px; cursor: pointer; color: #ffdd99; z-index: 1000; }
    .gold-flash { text-align: center; animation: goldPulse 1.4s infinite; background: linear-gradient(45deg, #FFD700, #FFA500, #FFD700); -webkit-background-clip: text; background-clip: text; color: transparent; }
    @keyframes goldPulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
  </style>

<script>
(function(){
  // ======================== UNIFIED AUDIO CONTROLLER ========================
  let currentAudio = null;
  let bgVideoElement = null;
  
  function stopCurrentAudio() { if(currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; } }
  function playSound(url, onErrorSilent=true) {
    stopCurrentAudio();
    const audio = new Audio(url);
    audio.preload = 'auto';
    audio.currentTime = 0;
    audio.play().catch(e => { if(!onErrorSilent) console.warn("Audio failed:", url, e); });
    currentAudio = audio;
    return audio;
  }
  function setBodyBackground(imageUrl) { document.body.style.backgroundImage = `url('${imageUrl}')`; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundPosition = 'center'; }
  function resetBackground() { document.body.style.backgroundImage = ''; }
  function playVideoBackground(videoUrl, loop=true) {
    if(bgVideoElement) { bgVideoElement.pause(); bgVideoElement.remove(); }
    const video = document.createElement('video');
    video.src = videoUrl;
    video.loop = loop;
    video.muted = true;
    video.playsInline = true;
    video.autoplay = true;
    video.style.position = 'fixed';
    video.style.top = 0;
    video.style.left = 0;
    video.style.width = '100%';
    video.style.height = '100%';
    video.style.objectFit = 'cover';
    video.style.zIndex = '-1';
    video.style.opacity = '0.4';
    video.play().catch(e => console.warn("Video autoplay blocked"));
    document.body.prepend(video);
    bgVideoElement = video;
  }
  function stopVideoBackground() { if(bgVideoElement) { bgVideoElement.pause(); bgVideoElement.remove(); bgVideoElement = null; } }
  
  // Preload critical assets (silent)
  const preloadList = ["login.mp3","shuffle.mp3","started.mp3","stopped.mp3","continued.mp3","nreistered.mp3","nwinner.mp3","winner.mp3","drink.jpg","blocked.jpg","video.mp4"];
  preloadList.forEach(src => { if(src.endsWith('.mp3')) new Audio(src); });
  
  // Number-to-audio mapping 1-75
  function getNumberAudio(num) {
    if(num>=1 && num<=15) return `b${num}.mp3`;
    if(num>=16 && num<=30) return `i${num}.mp3`;
    if(num>=31 && num<=45) return `n${num}.mp3`;
    if(num>=46 && num<=60) return `g${num}.mp3`;
    if(num>=61 && num<=75) return `o${num}.mp3`;
    return null;
  }
  
  // ======================== FULL GAME LOGIC (PRESERVED) ========================
  const languages = { en:{ name:'English',flag:'🇬🇧'}, am:{ name:'አማርኛ',flag:'🇪🇹'}, ti:{ name:'ትግርኛ',flag:'🇪🇷'}, om:{ name:'Afaan Oromo',flag:'🇪🇹'}, so:{ name:'Soomaali',flag:'🇸🇴'}, ar:{ name:'العربية',flag:'🇸🇩'} };
  let translations={}; Object.keys(languages).forEach(c=>{ translations[c]={}; });
  const defaultTrans={ welcomeTitle:'✨ Miracle Online Bingo ✨', fullNameLabel:'📛 Full Name', phoneLabel:'📞 Phone', paymentLabel:'💰 Payment (ETB)', gameAmountLabel:'🎮 Game Amount', roundsLabel:'🔄 Rounds', backToWelcomeBtn:'◀ Back', boardSelectionBtn:'🎲 Board', startGameBtn:'Start ▶', notifyWinBtn:'Claim', callToggleBtn:'Call', backToRegIconBtn:'◀ Back', summaryIconBtn:'Next ▶', paidLabel:'💵 Paid', wonLabel:'🏆 Won', commissionLabel:'🤝 Commission', rewardLabel:'🎁 Reward', jackpotLabel:'🎰 Jackpot', totalBalanceLabel:'💰 Total Balance', withdrawLabel:'💸 Withdraw Amount', backToGameFromSummary:'◀ Back', withdrawCallBtn:'Withdraw', roleSelectLabel:'🎭 Registered as', playerOption:'👤 Player', agentOption:'🤝 Agent' };
  for(let c of Object.keys(languages)) translations[c]={...defaultTrans};
  let currentLang=localStorage.getItem('bingo_lang')||'en';
  function t(key){ return translations[currentLang]?.[key] || defaultTrans[key] || key; }
  function updateLanguage(){ 
    Object.keys(defaultTrans).forEach(key=>{ let el=document.getElementById(key); if(el && el.tagName!=='SELECT' && el.tagName!=='INPUT') el.innerText=t(key); });
    let roleSelect=document.getElementById('roleSelect'); if(roleSelect){ roleSelect.options[0].innerHTML=t('playerOption'); roleSelect.options[1].innerHTML=t('agentOption'); } 
    document.getElementById('welcomeTitle').innerHTML=t('welcomeTitle'); 
  }
  function buildLangDropdown(){ let dd=document.getElementById('langDropdown'); dd.innerHTML=''; Object.entries(languages).forEach(([code,l])=>{ let div=document.createElement('div'); div.className='lang-option'; div.innerHTML=`${l.flag} ${l.name}`; div.onclick=()=>{ currentLang=code; updateLanguage(); dd.style.display='none'; localStorage.setItem('bingo_lang',code); }; dd.appendChild(div); }); }
  buildLangDropdown(); updateLanguage();
  function activateFullscreen(){ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(e=>{}); }
  document.querySelectorAll('.header-fs-btn, #fullscreenToggle').forEach(btn=>btn.addEventListener('click',()=>{ activateFullscreen(); }));
  setTimeout(activateFullscreen, 200);
  
  let users=JSON.parse(localStorage.getItem('bingo_users')||'[]'); 
  let jackpotAmount=parseFloat(localStorage.getItem('jackpotAmount')||'0'); 
  let currentUser=null; 
  let selectedBoardsArray=[], windowSelectedBoardValues=[]; 
  let gameActive=false, calledNumbers=[], boards=[], callingInterval=null; 
  let currentRound=1, totalRounds=1; 
  let winnersHistory=JSON.parse(localStorage.getItem('gameHistory')||'[]'); 
  let usedBoardsInSession=new Set(); 
  let manualMarks=new Map();
  let adminPermissions=JSON.parse(localStorage.getItem('admin_perms')||'{"boardEnabled":true,"withdrawEnabled":true,"winBtnEnabled":true,"callEnabled":true,"gameAmountDefault":5,"paymentDefault":10,"roundDefault":1}');
  let blockedForRound = false;
  
  function saveData(){ localStorage.setItem('bingo_users',JSON.stringify(users)); localStorage.setItem('jackpotAmount',jackpotAmount); localStorage.setItem('admin_perms',JSON.stringify(adminPermissions)); localStorage.setItem('gameHistory',JSON.stringify(winnersHistory)); updateUI(); }
  function showToast(msg){ let d=document.createElement('div'); d.style.cssText='position:fixed;bottom:80px;left:20px;right:20px;background:#111;color:#8f8;padding:12px;border-radius:40px;z-index:9999;text-align:center;'; d.innerText=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),1500); }
  function updateUI(){ 
    document.getElementById('memberCountGame').innerText=users.length; 
    let playersCount=users.filter(u=>u.type==='player').length; let agentsCount=users.filter(u=>u.type==='agent').length; 
    document.getElementById('playersCount').innerText=playersCount; document.getElementById('agentsCount').innerText=agentsCount; 
    if(currentUser){ let total=(currentUser.paidBalance||0)+(currentUser.wonBalance||0)+(currentUser.totalCommission||0)+(currentUser.rewardPoints||0)+(currentUser.jackpotHit||0)-(currentUser.totalWithdrawn||0);
      document.getElementById('paidBalance').value=(currentUser.paidBalance||0).toFixed(2); document.getElementById('wonBalanceDisplay').value=(currentUser.wonBalance||0).toFixed(2); 
      document.getElementById('commissionDisplay').value=(currentUser.totalCommission||0).toFixed(2); document.getElementById('rewardDisplay').value=(currentUser.rewardPoints||0).toFixed(2); 
      document.getElementById('jackpotHitDisplay').value=(currentUser.jackpotHit||0).toFixed(2); document.getElementById('totalBalanceDisplay').value=total.toFixed(2);
    }
    document.getElementById('roundDisplayBtn').innerHTML=`🔄 ${currentRound}/${totalRounds}`;
    let totalPlayers=users.filter(u=>u.type==='player').length; let gameAmt=currentUser?.gameAmount||5; let wonValue=totalPlayers*gameAmt*0.75;
    document.getElementById('wonValueFloat').innerText=`🏆 ${wonValue.toFixed(2)} ETB`;
  }
  function generateBoard(centerNum){ let ranges=[[1,15],[16,30],[31,45],[46,60],[61,75]]; let board=Array(5).fill().map(()=>Array(5)); for(let c=0;c<5;c++){ let nums=new Set(); while(nums.size<5){ let r=Math.floor(Math.random()*(ranges[c][1]-ranges[c][0]+1))+ranges[c][0]; nums.add(r); } [...nums].forEach((v,i)=> board[i][c]=v); } board[2][2]=centerNum; return board; }
  function renderBoards(){ let container=document.getElementById('multiBoardsContainer'); container.innerHTML=''; let carousel=document.createElement('div'); carousel.className='boards-carousel'; boards.forEach((board,idx)=>{ let boardDiv=document.createElement('div'); boardDiv.className='single-board'; boardDiv.innerHTML=`<div class="bingo-letters"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div><div class="board-full-grid" id="grid-${idx}"></div>`; let grid=boardDiv.querySelector(`#grid-${idx}`); for(let i=0;i<5;i++) for(let j=0;j<5;j++){ let val=board[i][j]; let cell=document.createElement('div'); cell.className='board-cell'; if(i===2&&j===2){ cell.innerHTML=`🎯${val}`; cell.style.background='#ffaa33'; } else cell.innerHTML=val; let cellKey=`${idx}-${i}-${j}`; if(manualMarks.has(cellKey)) cell.classList.add('manual-mark'); cell.onclick=(e)=>{ e.stopPropagation(); if(!gameActive||blockedForRound) return; if(cell.classList.contains('manual-mark')){ cell.classList.remove('manual-mark'); manualMarks.delete(cellKey); } else { cell.classList.add('manual-mark'); manualMarks.set(cellKey,true); } }; grid.appendChild(cell); } carousel.appendChild(boardDiv); }); container.appendChild(carousel); }
  function initGame(selectedNums){ if(!selectedNums.length) return false; if(currentUser?.type==='player') { let cost = currentUser.gameAmount || 10; if(((currentUser.paidBalance||0)+(currentUser.wonBalance||0)+(currentUser.totalCommission||0)+(currentUser.rewardPoints||0)+(currentUser.jackpotHit||0)-(currentUser.totalWithdrawn||0)) < cost){ showToast('Insufficient balance'); return false; } currentUser.paidBalance = (currentUser.paidBalance||0) + cost; jackpotAmount+=cost; saveData(); } boards=[]; manualMarks.clear(); selectedNums.forEach(s=>boards.push(generateBoard(s))); gameActive=true; calledNumbers=[]; blockedForRound=false; renderBoards(); playSound("started.mp3"); addNotification(`Game started`); return true; }
  function showWinnerFullscreen(winnerName, amount, boardIdx, phone, jackpotShare){ let div=document.createElement('div'); div.className='fullscreen-win-notify'; div.innerHTML=`<div style="background:#1e3a34;padding:30px;border-radius:60px;"><h1>🎉 WINNER 🎉</h1><h2>${winnerName}</h2><p>📞 ${phone}</p><p>💰 Won: ${amount.toFixed(2)} ETB</p></div>`; document.body.appendChild(div); setTimeout(()=>div.remove(),15000); }
  function validateAndWin(manualClaim=false){ if(!gameActive) return showToast('Game not active'); if(blockedForRound && !manualClaim) return showToast('Blocked'); let foundWinner=false; let winBoardIdx=-1; for(let bi=0;bi<boards.length;bi++){ let b=boards[bi]; let isWinner=false; for(let i=0;i<5;i++) if(b[i].every(v=>calledNumbers.includes(v))) isWinner=true; for(let j=0;j<5;j++) if([0,1,2,3,4].every(i=>calledNumbers.includes(b[i][j]))) isWinner=true; if(isWinner && currentUser){ winBoardIdx=bi; foundWinner=true; break; } } if(foundWinner && currentUser){ let winAmount = jackpotAmount * 0.6; let rewardPart = winAmount*0.05; currentUser.wonBalance = (currentUser.wonBalance||0) + winAmount; currentUser.rewardPoints = (currentUser.rewardPoints||0) + rewardPart; currentUser.jackpotHit = (currentUser.jackpotHit||0) + winAmount*0.2; jackpotAmount = jackpotAmount*0.3; if(callingInterval){ clearInterval(callingInterval); callingInterval=null; document.getElementById('callToggleBtn').innerHTML='Call'; } gameActive=false; winnersHistory.unshift({ timestamp:new Date().toLocaleString(), winnerName:currentUser.name, amount:winAmount }); saveData(); playSound("winner.mp3"); playVideoBackground("video.mp4"); showWinnerFullscreen(currentUser.name, winAmount, windowSelectedBoardValues[winBoardIdx]||winBoardIdx+1, currentUser.phone, winAmount*0.2); addNotification(`${currentUser.name} WON ${winAmount} ETB`); blockedForRound=false; } else if(manualClaim && !foundWinner){ blockedForRound=true; playSound("nwinner.mp3"); setBodyBackground("blocked.jpg"); showToast('❌ Not a winner! Blocked.'); } }
  function openAdminPanel(){ let pwd=prompt("🔐 ADMIN ACCESS"); if(pwd !== "ass21gas23") { showToast("Access Denied"); return; } let modal=document.createElement('div'); modal.className='fullscreen-modal'; modal.innerHTML=`<div class="modal-content"><button class="close-overlay">✖</button><h2>👑 BOSS CONTROL</h2><div class="admin-grid"><button id="adminToggleBoard" class="admin-toggle-btn">🎲 BOARD: ${adminPermissions.boardEnabled?'ENABLED':'DISABLED'}</button><button id="adminToggleWithdraw" class="admin-toggle-btn">💸 WITHDRAW: ${adminPermissions.withdrawEnabled?'ENABLED':'DISABLED'}</button><button id="adminToggleWin" class="admin-toggle-btn">🏆 WIN BTN: ${adminPermissions.winBtnEnabled?'ENABLED':'DISABLED'}</button><button id="adminToggleCall" class="admin-toggle-btn">🎲 CALL: ${adminPermissions.callEnabled?'ENABLED':'DISABLED'}</button><button id="adminEditDefaults" class="admin-toggle-btn">⚙️ Defaults</button><button id="adminViewHistory" class="admin-toggle-btn">📜 HISTORY</button><button id="adminResetJackpot" class="admin-toggle-btn">🎰 RESET JACKPOT</button></div></div>`; document.body.appendChild(modal); modal.querySelector('.close-overlay').onclick=()=>modal.remove();
    document.getElementById('adminToggleBoard').onclick=()=>{ adminPermissions.boardEnabled=!adminPermissions.boardEnabled; saveData(); modal.remove(); openAdminPanel(); };
    document.getElementById('adminToggleWithdraw').onclick=()=>{ adminPermissions.withdrawEnabled=!adminPermissions.withdrawEnabled; saveData(); modal.remove(); openAdminPanel(); };
    document.getElementById('adminToggleWin').onclick=()=>{ adminPermissions.winBtnEnabled=!adminPermissions.winBtnEnabled; saveData(); modal.remove(); openAdminPanel(); };
    document.getElementById('adminToggleCall').onclick=()=>{ adminPermissions.callEnabled=!adminPermissions.callEnabled; if(!adminPermissions.callEnabled && callingInterval){ clearInterval(callingInterval); callingInterval=null; document.getElementById('callToggleBtn').innerHTML='Call'; } saveData(); modal.remove(); openAdminPanel(); };
    document.getElementById('adminEditDefaults').onclick=()=>{ let pay=prompt("Default Payment",10); let game=prompt("Default Game Amount",5); let rnd=prompt("Default Rounds",1); if(pay) adminPermissions.paymentDefault=parseFloat(pay); if(game) adminPermissions.gameAmountDefault=parseFloat(game); if(rnd) adminPermissions.roundDefault=parseInt(rnd); document.getElementById('paymentAmountInput').value=adminPermissions.paymentDefault; document.getElementById('gameAmountInput').value=adminPermissions.gameAmountDefault; document.getElementById('gameRoundInput').value=adminPermissions.roundDefault; saveData(); modal.remove(); openAdminPanel(); };
    document.getElementById('adminViewHistory').onclick=()=>{ let hm=document.createElement('div'); hm.className='fullscreen-modal'; hm.innerHTML=`<div class="modal-content"><button class="close-overlay">✖</button><h3>📜 HISTORY</h3>${winnersHistory.map(w=>`<div>${w.timestamp} - ${w.winnerName} - ${w.amount.toFixed(2)} ETB</div>`).join('')||'<p>None</p>'}</div>`; document.body.appendChild(hm); hm.querySelector('.close-overlay').onclick=()=>hm.remove(); };
    document.getElementById('adminResetJackpot').onclick=()=>{ jackpotAmount=0; saveData(); modal.remove(); openAdminPanel(); };
  }
  document.getElementById('adminPanelBtn').onclick=openAdminPanel;
  document.getElementById('withdrawCallBtn').onclick=()=>{ if(!adminPermissions.withdrawEnabled){ showToast('Withdrawals disabled'); return; } let amt=parseFloat(document.getElementById('withdrawAmount').value); if(!currentUser) return; let total=(currentUser.paidBalance||0)+(currentUser.wonBalance||0)+(currentUser.totalCommission||0)+(currentUser.rewardPoints||0)+(currentUser.jackpotHit||0)-(currentUser.totalWithdrawn||0); if(isNaN(amt)||amt<25) return showToast('Min 25 ETB'); if(amt>total) return; currentUser.totalWithdrawn=(currentUser.totalWithdrawn||0)+amt; saveData(); navigator.clipboard.writeText(`🏦 WITHDRAW\n${currentUser.name}\n💰 ${amt} ETB`); window.open('https://t.me/GOGSmore','_blank'); showToast('Withdraw requested'); };
  function showPlayersTable(){ let p=users.filter(u=>u.type==='player'); let html=`<div class="compact-scroll"><table class="data-table"><thead><tr><th>Name</th><th>Phone</th><th>Paid</th><th>Won</th><th>Total</th></tr></thead><tbody>${p.map(pl=>`<tr><td>${pl.name}</td><td>${pl.phone||''}</td><td>${(pl.paidBalance||0).toFixed(2)}</td><td>${(pl.wonBalance||0).toFixed(2)}</td><td>${((pl.paidBalance||0)+(pl.wonBalance||0)+(pl.totalCommission||0)+(pl.rewardPoints||0)+(pl.jackpotHit||0)-(pl.totalWithdrawn||0)).toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`; let m=document.createElement('div'); m.className='fullscreen-modal'; m.innerHTML=`<div class="modal-content"><button class="close-overlay">✖</button><h3>👥 Users</h3>${html}</div>`; document.body.appendChild(m); m.querySelector('.close-overlay').onclick=()=>m.remove(); }
  function showAgentsTable(){ let a=users.filter(u=>u.type==='agent'); let html=`<div class="compact-scroll"><table class="data-table"><thead><tr><th>Name</th><th>Phone</th><th>Commission</th><th>Total</th></tr></thead><tbody>${a.map(ag=>`<tr><td>${ag.name}</td><td>${ag.phone||'—'}</td><td>${(ag.totalCommission||0).toFixed(2)}</td><td>${((ag.paidBalance||0)+(ag.wonBalance||0)+(ag.totalCommission||0)+(ag.rewardPoints||0)+(ag.jackpotHit||0)-(ag.totalWithdrawn||0)).toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`; let m=document.createElement('div'); m.className='fullscreen-modal'; m.innerHTML=`<div class="modal-content"><button class="close-overlay">✖</button><h3>📢 Refs</h3>${html}</div>`; document.body.appendChild(m); m.querySelector('.close-overlay').onclick=()=>m.remove(); }
  document.getElementById('playersTableBtn').onclick=showPlayersTable; document.getElementById('agentsTableBtn').onclick=showAgentsTable;
  document.getElementById('notifyWinBtn').onclick=()=>{ if(!adminPermissions.winBtnEnabled){ showToast('Win button disabled'); return; } validateAndWin(true); };
  document.getElementById('wonStatsBtn').onclick=()=>{ let modal=document.createElement('div'); modal.className='fullscreen-modal'; modal.innerHTML=`<div class="modal-content"><button class="close-overlay">✖</button><h3>🏆 Winners</h3>${winnersHistory.map(w=>`<div>${w.timestamp} - ${w.winnerName} - ${w.amount.toFixed(2)} ETB</div>`).join('')||'<p>None</p>'}</div>`; document.body.appendChild(modal); modal.querySelector('.close-overlay').onclick=()=>modal.remove(); };
  function switchPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page')); document.getElementById(id).classList.add('active-page'); updateUI(); activateFullscreen(); updateFloatingVisibility(); if(id==='page3') stopVideoBackground(); }
  document.getElementById('startGameBtn').onclick=()=>{ if(adminPermissions.boardEnabled===false && currentUser?.type!=='admin'){ showToast('Board disabled'); return; } let roundVal=parseInt(document.getElementById('gameRoundInput').value); totalRounds=roundVal; currentRound=1; if(windowSelectedBoardValues.length){ initGame(windowSelectedBoardValues); switchPage('page2'); } else showToast('Select boards first'); };
  let callBtn=document.getElementById('callToggleBtn'); let isCalling=false;
  callBtn.onclick=function(){ if(!adminPermissions.callEnabled){ showToast('Calling disabled'); return; } if(!gameActive){ if(boards.length) initGame(windowSelectedBoardValues); else return; } if(callingInterval){ clearInterval(callingInterval); callingInterval=null; this.innerHTML='Call'; playSound("stopped.mp3"); } else { playSound("continued.mp3"); callingInterval=setInterval(()=>{ if(!gameActive) return; let avail=[]; for(let i=1;i<=75;i++) if(!calledNumbers.includes(i)) avail.push(i); if(!avail.length){ clearInterval(callingInterval); callingInterval=null; return; } let num=avail[Math.floor(Math.random()*avail.length)]; calledNumbers.push(num); let letter=num<=15?'B':num<=30?'I':num<=45?'N':num<=60?'G':'O'; document.getElementById('currentCalledDisplay').innerHTML=`${letter}-${num}`; let hist=document.getElementById('callerHistoryContainer'); let span=document.createElement('span'); span.style.cssText='background:#2b4b42;padding:4px 12px;border-radius:20px;'; span.innerText=`${letter}-${num}`; hist.prepend(span); if(hist.children.length>12) hist.lastChild.remove(); renderBoards(); let audioFile=getNumberAudio(num); if(audioFile) playSound(audioFile); },2000); this.innerHTML='Stop'; } };
  document.getElementById('boardSelectionBtn').onclick=()=>{ if(!adminPermissions.boardEnabled && currentUser?.type!=='admin'){ showToast('Board disabled'); return; } let modal=document.createElement('div'); modal.className='fullscreen-modal'; modal.innerHTML=`<div class="modal-content"><button class="close-overlay">✖</button><h3>Select Boards (1-1000)</h3><input id="boardSearchInput" class="search-input" placeholder="🔍 Search..."><div id="summarySel">0 selected</div><div id="boardGrid" class="board-grid-responsive"></div><button id="confirmBoards" class="action-btn">Confirm</button></div>`; document.body.appendChild(modal); let grid=modal.querySelector('#boardGrid'),summary=modal.querySelector('#summarySel'),searchInput=modal.querySelector('#boardSearchInput'); function renderBoardList(filter=''){ grid.innerHTML=''; for(let i=1;i<=1000;i++){ if(filter&&!i.toString().includes(filter)) continue; let opt=document.createElement('div'); opt.className='board-number'+(selectedBoardsArray.includes(i)?' selected':'')+(usedBoardsInSession.has(i)?' disabled':''); opt.textContent=i+(usedBoardsInSession.has(i)?' (U)':''); opt.onclick=()=>{ if(usedBoardsInSession.has(i)) return; if(selectedBoardsArray.includes(i)) selectedBoardsArray=selectedBoardsArray.filter(v=>v!==i); else selectedBoardsArray.push(i); summary.textContent=`${selectedBoardsArray.length} selected`; renderBoardList(searchInput.value); }; grid.appendChild(opt); } summary.textContent=`${selectedBoardsArray.length} selected`; } searchInput.oninput=()=>renderBoardList(searchInput.value); renderBoardList(); modal.querySelector('#confirmBoards').onclick=()=>{ windowSelectedBoardValues=[...selectedBoardsArray]; selectedBoardsArray.forEach(b=>usedBoardsInSession.add(b)); modal.remove(); }; modal.querySelector('.close-overlay').onclick=()=>modal.remove(); };
  document.getElementById('backToWelcomeBtn').onclick=()=>switchPage('page0');

  document.getElementById('langToggleBtn').onclick=(e)=>{ e.stopPropagation(); const dd=document.getElementById('langDropdown'); dd.style.display=dd.style.display==='none'?'block':'none'; };
  document.addEventListener('click',(e)=>{ if(!e.target.closest('#langToggleBtn')&&!e.target.closest('#langDropdown')) document.getElementById('langDropdown').style.display='none'; });
  window.createUserFromRegister = () => { let name=document.getElementById('userName').value.trim()||'Guest'; let phone=document.getElementById('playerPhone').value.trim()||'09xxxx'; let role=document.getElementById('roleSelect').value; let gameAmt=parseFloat(document.getElementById('gameAmountInput').value)||5; let paymentVal=parseFloat(document.getElementById('paymentAmountInput').value)||10; if(role==='player'){ currentUser={ id:Date.now()+'_'+Math.random(), name, phone, type:'player', paidBalance:paymentVal, wonBalance:0, gameAmount:gameAmt, rewardPoints:0, totalCommission:0, totalWithdrawn:0, jackpotHit:0, boardLocked:false, withdrawLocked:false }; users.push(currentUser); jackpotAmount+=paymentVal; } else { currentUser={ id:Date.now()+'_agt', name, phone, type:'agent', paidBalance:0, wonBalance:0, totalCommission:0, rewardPoints:0, jackpotHit:0, totalWithdrawn:0, boardLocked:false, withdrawLocked:false }; users.push(currentUser); } saveData(); switchPage('page1'); playSound("nreistered.mp3"); };
  document.getElementById('startAppBtn').onclick=()=>{ if(!currentUser){ playSound("login.mp3"); setBodyBackground("drink.jpg"); window.createUserFromRegister(); } else switchPage('page1'); };

  // Timer & Floating Elements
  let timerDiv = document.createElement('div'); timerDiv.className='floating-text'; let timerInput=document.createElement('input'); timerInput.type='text'; timerInput.className='floating-editable-timer'; timerInput.value=localStorage.getItem('savedTimerValue')||'01:03:00'; timerDiv.appendChild(timerInput); document.body.appendChild(timerDiv);
  let countdownSeconds=3780; function parseTimerToSeconds(val){ let parts=val.split(':'); if(parts.length===3) return parseInt(parts[0])*3600+parseInt(parts[1])*60+parseInt(parts[2]); return 3780; } function updateTimerDisplay(){ let h=Math.floor(countdownSeconds/3600), m=Math.floor((countdownSeconds%3600)/60), s=countdownSeconds%60; timerInput.value=`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; localStorage.setItem('savedTimerValue',timerInput.value); } timerInput.addEventListener('blur',()=>{ let newSec=parseTimerToSeconds(timerInput.value); if(!isNaN(newSec)) countdownSeconds=newSec; updateTimerDisplay(); }); setInterval(()=>{ let activeId=document.querySelector('.active-page')?.id; if((activeId==='page0'||activeId==='page1') && countdownSeconds>0){ countdownSeconds--; updateTimerDisplay(); } },1000);
  let phoneFloat=document.createElement('div'); phoneFloat.className='floating-text'; let phoneInput=document.createElement('input'); phoneInput.type='text'; phoneInput.className='editable-floating'; phoneInput.style.fontSize='1.8rem'; phoneInput.value=localStorage.getItem('phoneFloatValue')||'0918203416'; phoneFloat.appendChild(phoneInput); document.body.appendChild(phoneFloat);
  let devCreditDiv=document.getElementById('devCredit'); let devInput=document.createElement('input'); devInput.type='text'; devInput.className='editable-floating'; devInput.style.fontSize='clamp(13px,4vw,20px)'; devInput.value=devCreditDiv.innerText; devCreditDiv.innerHTML=''; devCreditDiv.appendChild(devInput);
  function initFloating(el,x,y){ let dx=1.2,dy=1.1; setInterval(()=>{ let w=window.innerWidth,h=window.innerHeight,rect=el.getBoundingClientRect(); if(x+rect.width>=w-12) dx=-Math.abs(dx); if(x<=8) dx=Math.abs(dx); if(y+rect.height>=h-12) dy=-Math.abs(dy); if(y<=8) dy=Math.abs(dy); x+=dx; y+=dy; el.style.left=x+'px'; el.style.top=y+'px'; let hue=(Date.now()/35)%360; el.style.color=`hsl(${hue},100%,60%)`; },45); } initFloating(phoneFloat,30,250); initFloating(timerDiv,40,120); initFloating(document.getElementById('wonValueFloat'),260,150);
  function updateFloatingVisibility(){ let activeId=document.querySelector('.active-page')?.id; phoneFloat.style.display=(activeId==='page3')?'block':'none'; timerDiv.style.display=(activeId==='page0'||activeId==='page1')?'block':'none'; }

})();
