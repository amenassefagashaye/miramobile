  function showAgentsTable(){ let a=users.filter(u=>u.type==='agent'); let html=`<div class="compact-scroll"><table class="data-table"><thead><tr><th>Name</th><th>Phone</th><th>Commission</th><th>Total</th></tr></thead><tbody>${a.map(ag=>`<tr><td>${ag.name}</td><td>${ag.phone||'—'}</td><td>${(ag.totalCommission||0).toFixed(2)}</td><td>${updateTotalBalance(ag).toFixed(2)}</td></tr>`).join('')}</tbody>}</table></div>`; let m=document.createElement('div'); m.className='fullscreen-modal'; m.innerHTML=`<div class="modal-content"><button class="close-overlay">✖</button><h3>📢 Refs</h3>${html}</div>`; document.body.appendChild(m); m.querySelector('.close-overlay').onclick=()=>m.remove(); }
  document.getElementById('playersTableBtn').onclick=showPlayersTable; document.getElementById('agentsTableBtn').onclick=showAgentsTable;
  document.getElementById('notifyWinBtn').onclick=()=>{ if(!adminPermissions.winBtnEnabled){ showToast('Win button disabled'); return; } validateAndWin(true); };
  document.getElementById('wonStatsBtn').onclick=()=>{ let modal=document.createElement('div'); modal.className='fullscreen-modal'; modal.innerHTML=`<div class="modal-content"><button class="close-overlay">✖</button><h3>🏆 Winners</h3>${winnersHistory.map(w=>`<div>${w.timestamp} - ${w.winnerName} - ${w.amount.toFixed(2)} ETB</div>`).join('')||'<p>None</p>'}</div>`; document.body.appendChild(modal); modal.querySelector('.close-overlay').onclick=()=>modal.remove(); };
  function openAdminPanel(){ let pwd=prompt("🔐 ADMIN ACCESS"); if(pwd !== "ass21gas23") { showToast("Access Denied"); return; } let modal=document.createElement('div'); modal.className='fullscreen-modal'; modal.innerHTML=`<div class="modal-content"><button class="close-overlay">✖</button><h2>👑 BOSS CONTROL</h2><div class="admin-grid"><button id="adminToggleBoard" class="admin-toggle-btn">🎲 BOARD: ${adminPermissions.boardEnabled ? 'ENABLED' : 'DISABLED'}</button><button id="adminToggleWithdraw" class="admin-toggle-btn">💸 WITHDRAW: ${adminPermissions.withdrawEnabled ? 'ENABLED' : 'DISABLED'}</button><button id="adminToggleWin" class="admin-toggle-btn">🏆 WIN BTN: ${adminPermissions.winBtnEnabled ? 'ENABLED' : 'DISABLED'}</button><button id="adminToggleCall" class="admin-toggle-btn">🎲 CALL: ${adminPermissions.callEnabled ? 'ENABLED' : 'DISABLED'}</button><button id="adminEditDefaults" class="admin-toggle-btn">⚙️ Defaults</button><button id="adminViewHistory" class="admin-toggle-btn">📜 HISTORY</button><button id="adminResetJackpot" class="admin-toggle-btn">🎰 RESET JACKPOT</button><hr><input id="adminUserPhone" placeholder="Phone"><button id="adminUnlockBoard" class="admin-toggle-btn">🔓 UNLOCK BOARD</button><button id="adminUnlockWithdraw" class="admin-toggle-btn">🔓 UNLOCK WITHDRAW</button></div></div>`; document.body.appendChild(modal); modal.querySelector('.close-overlay').onclick=()=>modal.remove(); 
  modal.querySelector('#adminToggleBoard').onclick=()=>{ adminPermissions.boardEnabled=!adminPermissions.boardEnabled; saveData(); modal.remove(); openAdminPanel(); }; modal.querySelector('#adminToggleWithdraw').onclick=()=>{ adminPermissions.withdrawEnabled=!adminPermissions.withdrawEnabled; saveData(); modal.remove(); openAdminPanel(); }; modal.querySelector('#adminToggleWin').onclick=()=>{ adminPermissions.winBtnEnabled=!adminPermissions.winBtnEnabled; saveData(); modal.remove(); openAdminPanel(); }; modal.querySelector('#adminToggleCall').onclick=()=>{ adminPermissions.callEnabled=!adminPermissions.callEnabled; saveData(); modal.remove(); openAdminPanel(); }; modal.querySelector('#adminEditDefaults').onclick=()=>{ let newGame=prompt('Default Game Amount', adminPermissions.gameAmountDefault); if(newGame)adminPermissions.gameAmountDefault=parseFloat(newGame); let newPay=prompt('Default Payment', adminPermissions.paymentDefault); if(newPay)adminPermissions.paymentDefault=parseFloat(newPay); let newRound=prompt('Default Rounds', adminPermissions.roundDefault); if(newRound)adminPermissions.roundDefault=parseInt(newRound); saveData(); modal.remove(); openAdminPanel(); }; modal.querySelector('#adminViewHistory').onclick=()=>{ alert(winnersHistory.map(w=>`${w.timestamp} ${w.winnerName} ${w.amount} ETB`).join('\n')||'No wins'); }; modal.querySelector('#adminResetJackpot').onclick=()=>{ jackpotAmount=0; saveData(); modal.remove(); openAdminPanel(); }; modal.querySelector('#adminUnlockBoard').onclick=()=>{ let phone=modal.querySelector('#adminUserPhone').value; let u=users.find(u=>u.phone===phone); if(u){ u.boardLocked=false; saveData(); showToast('Board unlocked'); } }; modal.querySelector('#adminUnlockWithdraw').onclick=()=>{ let phone=modal.querySelector('#adminUserPhone').value; let u=users.find(u=>u.phone===phone); if(u){ u.withdrawLocked=false; saveData(); showToast('Withdraw unlocked'); } }; }
})();
</script>
