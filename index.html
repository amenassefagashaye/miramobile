<script>
(function(){
  // ========== ADVANCED MEDIA CONTROLLER ==========
  class MediaController {
    constructor() { this.currentAudio = null; this.videoElement = null; }
    playAudio(src, loop = false) { try { if (this.currentAudio) { this.currentAudio.pause(); this.currentAudio.currentTime = 0; } const audio = new Audio(src); audio.loop = loop; audio.currentTime = 0; audio.play().catch(e=>console.warn("Audio autoplay blocked:",e)); this.currentAudio = audio; audio.onended = () => { if (this.currentAudio === audio) this.currentAudio = null; }; return audio; } catch(e) { console.warn(e); return null; } }
    stopAudio() { if (this.currentAudio) { this.currentAudio.pause(); this.currentAudio.currentTime = 0; this.currentAudio = null; } }
    setBackgroundImage(imgSrc) { const container = document.getElementById('appContainer'); if(container) container.style.backgroundImage = `url('${imgSrc}')`; }
    setBackgroundVideo(videoSrc, loop=true, muted=true) { let existing = document.querySelector('.video-background'); if(existing) existing.remove(); const video = document.createElement('video'); video.src = videoSrc; video.className = 'video-background'; video.autoplay = true; video.loop = loop; video.muted = muted; video.playsInline = true; document.body.insertBefore(video, document.body.firstChild); video.play().catch(e=>console.warn("video autoplay failed",e)); this.videoElement = video; }
    removeBackgroundVideo() { if(this.videoElement) { this.videoElement.remove(); this.videoElement = null; } }
    resetBackground() { this.removeBackgroundVideo(); const container = document.getElementById('appContainer'); if(container) container.style.backgroundImage = ''; }
  }
  const media = new MediaController();
  // Preload key audio (optional)
  const audioFiles = ['login.mp3','shuffle.mp3','started.mp3','stopped.mp3','continued.mp3','nreistered.mp3','nwinner.mp3','winner.mp3'];
  audioFiles.forEach(f => { const a = new Audio(f); a.load(); });
  // Bingo number to audio mapping
  function getNumberAudio(num) {
    if(num>=1 && num<=15) return `b${num}.mp3`;
    if(num>=16 && num<=30) return `i${num}.mp3`;
    if(num>=31 && num<=45) return `n${num}.mp3`;
    if(num>=46 && num<=60) return `g${num}.mp3`;
    if(num>=61 && num<=75) return `o${num}.mp3`;
    return null;
  }
  // ========== EXISTING LOGIC (preserved) ==========
  const languages = { en:{ name:'English',flag:'🇬🇧'}, am:{ name:'አማርኛ',flag:'🇪🇹'}, ti:{ name:'ትግርኛ',flag:'🇪🇷'}, om:{ name:'Afaan Oromo',flag:'🇪🇹'}, so:{ name:'Soomaali',flag:'🇸🇴'}, ar:{ name:'العربية',flag:'🇸🇩'}, es:{ name:'Español',flag:'🇪🇸'}, fr:{ name:'Français',flag:'🇫🇷'}, de:{ name:'Deutsch',flag:'🇩🇪'} };
  let translations={}; Object.keys(languages).forEach(c=>{ translations[c]={}; });
  const defaultTrans={ welcomeTitle:'✨ Miracle Online Bingo ✨', fullNameLabel:'📛 Full Name', phoneLabel:'📞 Phone', paymentLabel:'💰 Payment (ETB)', gameAmountLabel:'🎮 Game Amount', roundsLabel:'🔄 Rounds', backToWelcomeBtn:'◀ Back', boardSelectionBtn:'🎲 Board', startGameBtn:'Start ▶', notifyWinBtn:'Win', callToggleBtn:'Call', backToRegIconBtn:'◀ Back', summaryIconBtn:'Next ▶', paidLabel:'💵 Paid', wonLabel:'🏆 Won', commissionLabel:'🤝 Commission', rewardLabel:'🎁 Reward', totalBalanceLabel:'💰 Total Balance', withdrawLabel:'💸 Withdraw Amount', backToGameFromSummary:'◀ Back', withdrawCallBtn:'Withdraw', stopCall:'Stop', roleSelectLabel:'🎭 Registered as', playerOption:'👤 Player', agentOption:'🤝 Agent' };
  for(let c of Object.keys(languages)) translations[c]={...defaultTrans};
  let currentLang=localStorage.getItem('bingo_lang')||'en';
  function t(key){ return translations[currentLang]?.[key] || defaultTrans[key] || key; }
  function updateLanguage(){ Object.keys(defaultTrans).forEach(key=>{ let el=document.getElementById(key); if(el && el.tagName!=='SELECT' && el.tagName!=='INPUT') el.innerText=t(key); }); let roleSelect=document.getElementById('roleSelect'); if(roleSelect){ roleSelect.options[0].innerHTML=t('playerOption'); roleSelect.options[1].innerHTML=t('agentOption'); } let welcomeEl=document.getElementById('welcomeTitle'); if(welcomeEl) welcomeEl.innerHTML=t('welcomeTitle'); }
  function buildLangDropdown(){ let dd=document.getElementById('langDropdown'); dd.innerHTML=''; Object.entries(languages).forEach(([code,l])=>{ let div=document.createElement('div'); div.className='lang-option'; div.innerHTML=`${l.flag} ${l.name}`; div.onclick=()=>{ currentLang=code; updateLanguage(); dd.style.display='none'; localStorage.setItem('bingo_lang',code); }; dd.appendChild(div); }); }

  function generateBoard(centerNum){ let ranges=[[1,15],[16,30],[31,45],[46,60],[61,75]]; let board=Array(5).fill().map(()=>Array(5)); for(let c=0;c<5;c++){ let nums=new Set(); while(nums.size<5){ let r=Math.floor(Math.random()*(ranges[c][1]-ranges[c][0]+1))+ranges[c][0]; nums.add(r); } [...nums].forEach((v,i)=> board[i][c]=v); } board[2][2]=centerNum; return board; }
  function renderBoards(){ let container=document.getElementById('multiBoardsContainer'); container.innerHTML=''; let carousel=document.createElement('div'); carousel.className='boards-carousel'; boards.forEach((board,idx)=>{ let boardDiv=document.createElement('div'); boardDiv.className='single-board'; boardDiv.innerHTML=`<div class="bingo-letters"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div><div class="board-full-grid" id="grid-${idx}"></div>`; let grid=boardDiv.querySelector(`#grid-${idx}`); for(let i=0;i<5;i++) for(let j=0;j<5;j++){ let val=board[i][j]; let cell=document.createElement('div'); cell.className='board-cell'; if(i===2&&j===2){ cell.innerHTML=`🎯${val}`; cell.style.background='#ffaa33'; } else cell.innerHTML=val; let cellKey=`${idx}-${i}-${j}`; if(manualMarks.has(cellKey)) cell.classList.add('manual-mark'); cell.onclick=(e)=>{ e.stopPropagation(); if(!gameActive||blockedForRound) return; if(cell.classList.contains('manual-mark')){ cell.classList.remove('manual-mark'); manualMarks.delete(cellKey); } else { cell.classList.add('manual-mark'); manualMarks.set(cellKey,true); } }; grid.appendChild(cell); } carousel.appendChild(boardDiv); }); container.appendChild(carousel); }

  let timerDiv = document.createElement('div'); timerDiv.id = 'countdownTimerContainer'; timerDiv.className='floating-text'; let timerInput=document.createElement('input'); timerInput.type='text'; timerInput.className='floating-editable-timer'; let savedTimer=localStorage.getItem('savedTimerValue'); timerInput.value=savedTimer||'01:03:00'; timerDiv.appendChild(timerInput); document.body.appendChild(timerDiv); let countdownSeconds=parseTimerToSeconds(timerInput.value); function parseTimerToSeconds(val){ let parts=val.split(':'); if(parts.length===3){ let h=parseInt(parts[0])||0, m=parseInt(parts[1])||0, s=parseInt(parts[2])||0; return h*3600+m*60+s; } return 3780; } function updateTimerDisplay(){ let h=Math.floor(countdownSeconds/3600); let m=Math.floor((countdownSeconds%3600)/60); let s=countdownSeconds%60; timerInput.value=`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; localStorage.setItem('savedTimerValue',timerInput.value); } setInterval(()=>{ let activePageId = document.querySelector('.active-page')?.id; if((activePageId === 'page0' || activePageId === 'page1') && countdownSeconds>0){ countdownSeconds--; updateTimerDisplay(); } },1000);
