<script>
(function(){
  // ENHANCED FULLSCREEN SYSTEM — reliable auto-activation on first user interaction + persistent toggle
  // No existing game logic modified — only fullscreen behavior added seamlessly.

  let fullscreenActive = false;
  let firstInteractionDone = false;
  let fullscreenRequestPending = false;
  
  // Helper: safe fullscreen request with error handling
  function requestFullscreen(element) {
    if (!element) element = document.documentElement;
    const method = element.requestFullscreen || element.webkitRequestFullscreen || element.msRequestFullscreen;
    if (method && !document.fullscreenElement && !document.webkitFullscreenElement) {
      try {
        method.call(element);
        return true;
      } catch(e) { console.warn("FS request failed", e); return false; }
    }
    return false;
  }
  
  function exitFullscreen() {
    const exitMethod = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (exitMethod && (document.fullscreenElement || document.webkitFullscreenElement)) {
      try {
        exitMethod.call(document);
        return true;
      } catch(e) { console.warn("FS exit failed", e); return false; }
    }
    return false;
  }
  
  function toggleFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      exitFullscreen();
      fullscreenActive = false;
    } else {
      if (requestFullscreen(document.documentElement)) {
        fullscreenActive = true;
      }
    }
  }
  
  // Listen to fullscreen change events to keep state synchronized
  function onFullscreenChange() {
    const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
    fullscreenActive = isFS;
    // Update all FS toggle button icons visually (optional subtle feedback)
    const btns = document.querySelectorAll('.header-fs-btn, #fullscreenToggle');
    btns.forEach(btn => {
      if (btn) btn.innerHTML = isFS ? '✖' : '⛶';
    });
  }
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);
  document.addEventListener('msfullscreenchange', onFullscreenChange);
  
  // Function to trigger first-time fullscreen on any user interaction (tap/click)
  function setupFirstInteractionFullscreen() {
    const activateOnce = function(e) {
      if (firstInteractionDone) return;
      firstInteractionDone = true;
      // Remove listeners after we've triggered the attempt
      ['click', 'touchstart', 'keydown'].forEach(ev => document.removeEventListener(ev, activateOnce));
      // Small delay to ensure event processing, but request fullscreen only on valid user gesture
      setTimeout(() => {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          requestFullscreen(document.documentElement);
        }
      }, 10);
    };
    // Attach to document for early reliable user gesture capture
    ['click', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, activateOnce, { once: false, passive: false }));
  }
  
  // Update all existing fullscreen toggle buttons to also use global toggle and reflect state.
  function enhanceExistingFullscreenButtons() {
    const fsButtons = [
      document.getElementById('fullscreenToggle'),
      document.getElementById('headerFsPage1'),
      document.getElementById('headerFsPage2'),
      document.getElementById('headerFsPage3')
    ];
    fsButtons.forEach(btn => {
      if (btn && btn.getAttribute('data-fs-enhanced') !== 'true') {
        btn.setAttribute('data-fs-enhanced', 'true');
        // preserve original click listeners? We'll keep our own but ensure we don't double-break anything.
        const oldClick = btn.onclick;
        btn.onclick = function(e) {
          e.stopPropagation();
          toggleFullscreen();
          if (oldClick && typeof oldClick === 'function') oldClick(e);
        };
        // ensure no duplicate event collisions but override safely.
        btn.addEventListener('click', function(e) { e.stopPropagation(); }, false);
      }
    });
    // initial icon set
    onFullscreenChange();
  }
  
  // Attach to all possible header FS buttons dynamically (mutation observer not needed but safe)
  // Also ensure that any dynamically created panels (modal) that might include a fullscreen button aren't needed.
  // The existing header buttons are static.
  
  // Run once DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      setupFirstInteractionFullscreen();
      enhanceExistingFullscreenButtons();
    });
  } else {
    setupFirstInteractionFullscreen();
    enhanceExistingFullscreenButtons();
  }
  
  // Ensure if any external script re-adds event duplications, we still work. Also maintain compatibility:
  // The original inline fullscreen listeners (from headerFsPage elements) are overridden but we keep original
  // because we called oldClick in our override. But to be absolutely safe, we attach enhanced behavior additionally.
  // We must also guarantee that the "fullscreenToggle" button on page0 (login) works seamlessly, which it does now.
  
  // Additionally, for complete safety in mobile browsers where fullscreen may be blocked unless triggered from direct user action,
  // our "firstInteractionDone" ensures that the very first tap anywhere (including on the massive door or any button) triggers fullscreen.
  // That obeys the requirement: no fullscreen request is triggered without user action.
  // The toggle buttons also work exactly as before but with enhanced state and fallback.
  
  // *************** ORIGINAL GAME LOGIC (unchanged) ****************
  // (Preserving all original game logic exactly as given)

  function generateBoard(centerNum) { let ranges=[[1,15],[16,30],[31,45],[46,60],[61,75]]; let board=Array(5).fill().map(()=>Array(5)); for(let c=0;c<5;c++){ let nums=new Set(); while(nums.size<5){ let r=Math.floor(Math.random()*(ranges[c][1]-ranges[c][0]+1))+ranges[c][0]; nums.add(r); } [...nums].forEach((v,i)=> board[i][c]=v); } board[2][2]=centerNum; return board; }

  function openAdminControl() { let pwd = prompt("🔐 Admin Access\nEnter password:"); if(pwd !== "ass21gas23") { showToast("Access Denied"); return; } let modal=document.createElement('div'); modal.className='fullscreen-modal'; modal.innerHTML=`<div class="modal-content"><button class="close-overlay">✖</button><h3>👑 Admin Panel</h3><div class="action-row"><button class="action-btn" id="adminBoardBtn">🎲 Board</button><button class="action-btn" id="adminWinnerCheckBtn">🏆 Winner</button><button class="action-btn" id="adminResetJackpotBtn">🎰 Reset Jackpot</button><button class="action-btn" id="adminClearUsedBoardsBtn">🧹 Clear Used</button></div><div class="action-row" style="margin-top:10px"><button class="action-btn" id="adminToggleBoardEnable">🎮 ${adminPermissions.boardEnabled?'Disable Board Selection':'Enable Board Selection'}</button><button class="action-btn" id="adminToggleWithdrawEnable">💸 ${adminPermissions.withdrawEnabled?'Disable Withdraw':'Enable Withdraw'}</button></div><div style="margin-top:12px"><label>🔧 User Override (Phone): <input id="adminUserPhone" placeholder="Phone" style="background:#fef7e0;border-radius:20px;padding:6px"></label><button id="adminToggleUserBoardBtn" class="action-btn" style="margin-top:5px">Toggle Board Access</button><button id="adminToggleUserWithdrawBtn" class="action-btn" style="margin-top:5px">Toggle Withdraw Access</button></div></div>`; document.body.appendChild(modal); modal.querySelector('.close-overlay').onclick=()=>modal.remove(); document.getElementById('adminBoardBtn').onclick = ()=>{ document.getElementById('boardSelectionBtn')?.click(); modal.remove(); }; document.getElementById('adminWinnerCheckBtn').onclick = ()=>{ let sel=document.getElementById('boardWinnerSelect'); if(sel&&sel.onchange) sel.dispatchEvent(new Event('change')); }; document.getElementById('adminResetJackpotBtn').onclick = ()=>{ jackpotAmount=0; saveData(); addNotification('Jackpot reset'); modal.remove(); }; document.getElementById('adminClearUsedBoardsBtn').onclick = ()=>{ usedBoardsInSession.clear(); addNotification('Cleared used boards'); modal.remove(); }; const toggleBoardBtn = document.getElementById('adminToggleBoardEnable'); toggleBoardBtn.onclick = () => { adminPermissions.boardEnabled = !adminPermissions.boardEnabled; saveData(); toggleBoardBtn.innerText = adminPermissions.boardEnabled?'Disable Board Selection':'Enable Board Selection'; showToast(`Board selection ${adminPermissions.boardEnabled?'enabled':'disabled'}`); modal.remove(); openAdminControl(); }; const toggleWithdrawBtn = document.getElementById('adminToggleWithdrawEnable'); toggleWithdrawBtn.onclick = () => { adminPermissions.withdrawEnabled = !adminPermissions.withdrawEnabled; saveData(); toggleWithdrawBtn.innerText = adminPermissions.withdrawEnabled?'Disable Withdraw':'Enable Withdraw'; showToast(`Withdraw ${adminPermissions.withdrawEnabled?'enabled':'disabled'}`); modal.remove(); openAdminControl(); }; document.getElementById('adminToggleUserBoardBtn').onclick = () => { let phone = document.getElementById('adminUserPhone').value.trim(); let user = users.find(u=>u.phone===phone); if(!user){ showToast('User not found'); return; } user.boardLocked = !user.boardLocked; saveData(); showToast(`${user.name} board access ${user.boardLocked?'locked':'unlocked'}`); modal.remove(); openAdminControl(); }; document.getElementById('adminToggleUserWithdrawBtn').onclick = () => { let phone = document.getElementById('adminUserPhone').value.trim(); let user = users.find(u=>u.phone===phone); if(!user){ showToast('User not found'); return; } user.withdrawLocked = !user.withdrawLocked; saveData(); showToast(`${user.name} withdraw ${user.withdrawLocked?'locked':'unlocked'}`); modal.remove(); openAdminControl(); }; }
  document.getElementById('adminPanelBtn').onclick = openAdminControl;
  document.getElementById('boardWinnerSelect').onchange = (e) => { let idx=e.target.value; if(idx && boards[idx]){ let b=boards[idx]; let win=false; for(let i=0;i<5;i++) if(b[i].every(v=>calledNumbers.includes(v))) win=true; for(let j=0;j<5;j++){ let col=true; for(let i=0;i<5;i++) if(!calledNumbers.includes(b[i][j])) col=false; if(col) win=true; } if(win){ showToast(`Board ${+idx+1} Winner!`); addNotification(`Winner: Board ${+idx+1}`); if(jackpotAmount>0 && currentUser){ let wa=jackpotAmount*0.3; currentUser.wonBalance=(currentUser.wonBalance||0)+wa; currentUser.rewardPoints=(currentUser.rewardPoints||0)+(wa*0.05); currentUser.jackpotHit=(currentUser.jackpotHit||0)+wa; jackpotAmount=jackpotAmount*0.7; saveData(); } winnersHistory.push(`Board ${+idx+1} won`); saveData(); } else showToast(`Board ${+idx+1} not winner`); } };
  document.getElementById('notifyWinBtn').onclick = () => { if(currentUser) addNotification(`${currentUser.name} claims win!`); showToast('Claim sent'); };
  document.getElementById('wonStatsBtn').onclick = ()=>{ let modal=document.createElement('div'); modal.className='fullscreen-modal'; modal.innerHTML=`<div class="modal-content"><button class="close-overlay">✖</button><h3>🏆 History</h3>${winnersHistory.map(w=>`<div>${w}</div>`).join('')||'<p>None</p>'}</div>`; document.body.appendChild(modal); modal.querySelector('.close-overlay').onclick=()=>modal.remove(); };
  function switchPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page')); document.getElementById(id).classList.add('active-page'); updateUI(); }
  window.switchPage=switchPage;
  document.getElementById('startGameBtn').onclick=()=>{ if(adminPermissions.boardEnabled===false && currentUser?.type!=='admin'){ showToast('Board selection disabled by admin'); return; } if(currentUser && currentUser.boardLocked){ showToast('Your board access is locked by admin'); return; } if(windowSelectedBoardValues.length){ totalRounds=+document.getElementById('gameRoundSelect').value; currentRound=1; initGame(windowSelectedBoardValues); switchPage('page2'); } else showToast('Select boards'); };
  let callBtn=document.getElementById('callToggleBtn'); callBtn.onclick=function(){ if(!gameActive){ if(boards.length) initGame(windowSelectedBoardValues); else return; } if(callingInterval){ clearInterval(callingInterval); callingInterval=null; this.innerHTML='🎲 Call'; } else { callingInterval=setInterval(()=>{ if(!gameActive) return; let avail=[]; for(let i=1;i<=75;i++) if(!calledNumbers.includes(i)) avail.push(i); if(!avail.length){ clearInterval(callingInterval); return; } let num=avail[Math.floor(Math.random()*avail.length)]; calledNumbers.push(num); let letter=num<=15?'B':num<=30?'I':num<=45?'N':num<=60?'G':'O'; document.getElementById('currentCalledDisplay').innerHTML=`${letter}-${num}`; let hist=document.getElementById('callerHistoryContainer'); let span=document.createElement('span'); span.style.cssText='background:#2b4b42;padding:4px 12px;border-radius:20px;'; span.innerText=`${letter}-${num}`; hist.prepend(span); if(hist.children.length>12) hist.lastChild.remove(); renderBoards(); },2000); this.innerHTML='⏹️ Stop'; } };
  document.getElementById('boardSelectionBtn').onclick=()=>{ if(!adminPermissions.boardEnabled && currentUser?.type!=='admin'){ showToast('Board selection disabled by admin'); return; } if(currentUser && currentUser.boardLocked && currentUser.type!=='admin'){ showToast('Your board selection is locked'); return; } if(currentUser?.type==='player' && (currentUser.balance||0) < (currentUser.gameAmount||10)){ showToast(`⚠️ Balance (${currentUser.balance||0} ETB) less than game amount (${currentUser.gameAmount} ETB). You can overview but cannot play unless payment completed.`); } let modal=document.createElement('div'); modal.className='fullscreen-modal'; modal.innerHTML=`<div class="modal-content" style="max-width:90%;"><button class="close-overlay">✖</button><h3>Select Boards (1-1000)</h3><input type="text" id="boardSearchInput" class="search-input" placeholder="🔍 Search..."><div id="summarySel">0 selected</div><div id="boardGrid"></div><button id="confirmBoards" class="action-btn" style="margin-top:12px;">Confirm</button></div>`; document.body.appendChild(modal); let grid=modal.querySelector('#boardGrid'), summary=modal.querySelector('#summarySel'); let searchInput=modal.querySelector('#boardSearchInput'); function renderBoardList(filterVal=''){ grid.innerHTML=''; for(let i=1;i<=1000;i++){ if(filterVal && !i.toString().includes(filterVal)) continue; let opt=document.createElement('div'); opt.className='board-number'+(selectedBoardsArray.includes(i)?' selected':'')+(usedBoardsInSession.has(i)?' disabled':''); opt.textContent=i+(usedBoardsInSession.has(i)?' (U)':''); opt.onclick=()=>{ if(usedBoardsInSession.has(i)) return; if(selectedBoardsArray.includes(i)) selectedBoardsArray=selectedBoardsArray.filter(v=>v!==i); else selectedBoardsArray.push(i); summary.textContent=`${selectedBoardsArray.length} selected`; renderBoardList(searchInput.value); }; grid.appendChild(opt); } summary.textContent=`${selectedBoardsArray.length} selected`; } searchInput.oninput=()=>renderBoardList(searchInput.value); renderBoardList(); modal.querySelector('#confirmBoards').onclick=()=>{ windowSelectedBoardValues=[...selectedBoardsArray]; selectedBoardsArray.forEach(b=>usedBoardsInSession.add(b)); modal.remove(); }; modal.querySelector('.close-overlay').onclick=()=>modal.remove(); };
  document.getElementById('backToWelcomeBtn').onclick=()=>switchPage('page0');
  document.getElementById('backToRegIconBtn').onclick=()=>{ if(callingInterval)clearInterval(callingInterval); switchPage('page1'); };
  document.getElementById('summaryIconBtn').onclick=()=>{ if(!adminPermissions.withdrawEnabled && currentUser?.type!=='admin' ){ showToast('Withdrawals disabled by admin'); return; } if(currentUser?.withdrawLocked){ showToast('Your withdrawals are locked'); return; } switchPage('page3'); };
  document.getElementById('backToGameFromSummary').onclick=()=>switchPage('page2');
  document.getElementById('langToggleBtn').onclick=(e)=>{ e.stopPropagation(); const dd=document.getElementById('langDropdown'); dd.style.display=dd.style.display==='none'?'block':'none'; };
  document.addEventListener('click',(e)=>{ if(!e.target.closest('#langToggleBtn')&&!e.target.closest('#langDropdown')) document.getElementById('langDropdown').style.display='none'; });
  window.handlePlayerPayment = (role) => { if(role==='player') { let msgAmh = `💸 ለመጫወት ክፍያ ያስፈልጋል!\nCBE: 1000062264911 ወይም Telebirr: 0918203416\nከከፈሉ በኋላ ስክሪን ሾት ወደ Telegram ይላኩ: t.me/GOGSmore`; alert(msgAmh); window.open('https://t.me/GOGSmore', '_blank'); } };
  window.createUserFromRegister = () => {
    let name = document.getElementById('userName').value.trim() || 'Guest';
    let phone = document.getElementById('playerPhone').value.trim() || '09xxxx';
    let role = document.getElementById('roleSelect').value;
    let gameAmt = parseInt(document.getElementById('gameAmountSelect').value) || 10;
    if(role === 'player') {
      currentUser = { id: Date.now()+'_'+Math.random(), name, phone, type:'player', balance:500, paidBalance:0, wonBalance:0, gameAmount:gameAmt, rewardPoints:0, totalCommission:0, totalWithdrawn:0, jackpotHit:0, boardLocked:false, withdrawLocked:false };
      users.push(currentUser);
      handlePlayerPayment('player');
    } else {
      currentUser = { id: Date.now()+'_agt', name, phone, type:'agent', paidBalance:0, wonBalance:0, totalCommission:0, rewardPoints:0, jackpotHit:0, totalWithdrawn:0, boardLocked:false, withdrawLocked:false };
      users.push(currentUser);
    }
    saveData();
    addNotification(`${name} registered as ${role}`);
    switchPage('page1');
  };
  document.getElementById('startAppBtn').onclick = () => { if(!currentUser) window.createUserFromRegister(); else switchPage('page1'); };
  if(!users.length) users.push({id:'admin1',name:'Admin',type:'admin'});
  saveData(); updateUI(); setInterval(updateUI, 1000);
})();
